[package]
name = "rustaccio"
version = "0.15.0"
edition = "2024"
license = "MIT OR Apache-2.0"
default-run = "rustaccio"

[features]
default = []
s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:aws-smithy-http-client"]
redis = ["dep:redis"]
postgres = ["dep:tokio-postgres"]
otel = [
  "dep:opentelemetry",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry_sdk",
  "dep:tracing-opentelemetry",
]

[dependencies]
async-trait = "0.1.92"
aws-config = { version = "1.13.2", optional = true, default-features = false, features = ["credentials-process", "rt-tokio", "sso"] }
aws-sdk-s3 = { version = "1.159.0", optional = true, default-features = false, features = ["sigv4a", "http-1x", "rt-tokio"] }
aws-smithy-http-client = { version = "1.5.3", optional = true, default-features = false, features = ["rustls-ring"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
base64 = "0.23.1"
futures = "0.3.34"
hex = "0.4.3"
hyper = { version = "1.12.0", default-features = false, features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "service", "tokio", "http1", "http2"] }
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
sha1 = "0.11.0"
redis = { version = "1.8.2", optional = true, default-features = false, features = ["tokio-comp", "script"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7.18", optional = true }
tower-http = { version = "0.7.1", default-features = false, features = ["request-id", "trace", "limit", "timeout"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-opentelemetry = { version = "0.34.0", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
urlencoding = "2.1.3"
uuid = { version = "1.29.3", features = ["serde", "v4"] }
opentelemetry = { version = "0.33.1", optional = true }
opentelemetry-otlp = { version = "0.33.1", optional = true, features = ["http-proto", "reqwest-client"] }
opentelemetry_sdk = { version = "0.33.1", optional = true, features = ["rt-tokio"] }
jiff = { version = "1.0.0", default-features = false, features = ["std"] }

[dev-dependencies]
flate2 = "1.1.11"
http-body-util = "0.1.5"
tar = "0.4.46"
tempfile = "3.27.0"
wiremock = "0.6.5"

[profile.dev]
# Line tables only: much faster codegen/link and far smaller artifacts.
# Breakpoints and backtraces still work; debugger variable inspection is limited.
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = "symbols"
panic = "abort"
debug = 0

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false
